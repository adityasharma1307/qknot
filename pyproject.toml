[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qknot"
version = "2.0.0"
description = "Hybrid post-quantum signing and identity registration for software supply chains, backed by a cross-registry audit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aditya Sharma", email = "f20230265@dubai.bits-pilani.ac.in"}
]
keywords = ["post-quantum", "cryptography", "software-supply-chain", "code-signing",
            "sigstore", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
# Core: sign, verify, entropy. No HuggingFace, no Sigstore, no RFC 3161.
dependencies = [
    "requests>=2.31",      # NIST beacon, Rekor, TSA HTTP clients
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",  # Ed25519 via OpenSSL
    "dilithium-py>=1.1",   # ML-DSA; offline only, see docs/THREAT-MODEL.md
]

[project.optional-dependencies]
# HuggingFace / npm / PyPI scanners: scan, scan-ids, audit-npm, audit-pypi, summarise.
audit = [
    "huggingface_hub>=0.24",
    "tenacity>=8.2",
    "pydantic>=2.5",
]
# RFC 3161 timestamps. Sign/verify work without it; upper-bound rescue does not.
transparency = [
    "rfc3161-client>=0.1",
]
# OIDC + TUF for `qknot register` and `qknot trust-material`.
register = [
    "sigstore>=3.0",
]
# Faster ML-DSA (liboqs). Optional. Status stays UNKNOWN until attested.
# Core keeps working with dilithium-py alone.
pqc-fast = [
    "liboqs-python>=0.12",
]
# IBM Quantum entropy (`qknot entropy --backend ibm`). Not needed for sign/verify.
qrng-ibm = [
    "qiskit>=1.2",
    "qiskit-ibm-runtime>=0.30",
]
# Notebooks and figures.
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jupyterlab>=4.0",
]
# Test suite, linters, notebook execution.
# `audit` and `pqc-fast` are also required for a complete run.
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "liboqs-python>=0.12",
]

[project.urls]
Homepage = "https://github.com/adityasharma1307/qknot"
Repository = "https://github.com/adityasharma1307/qknot"
Documentation = "https://github.com/adityasharma1307/qknot#readme"
Issues = "https://github.com/adityasharma1307/qknot/issues"
Changelog = "https://github.com/adityasharma1307/qknot/blob/main/docs/RELEASE-NOTES-v2.0.0.md"
DOI = "https://doi.org/10.5281/zenodo.21886269"

[project.scripts]
qknot = "qknot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",
    # typer.Option() in a default is the documented Typer idiom;
    # the "singleton variable" workaround would obscure the CLI.
    "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# jsonschema warns that the OMS $schema draft is unresolvable offline.
# Vendoring the schemas is deliberate; the warning is not actionable.
filterwarnings = ["ignore:The metaschema specified by .schema:DeprecationWarning"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    # The suite is networked by default. `offline` closes sockets for tests
    # that must exercise a fallback. `allow_network` remains for tests that
    # document a live dependency.
    "allow_network: test genuinely requires network access",
    "offline: close sockets so this test cannot reach the network",
    "allow_sleeping: test genuinely needs real time.sleep",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# `strict = true` above was declared but had never passed -- 69 errors, so the
# claim was decorative. `qknot.signing` now genuinely satisfies it, which is the
# half that matters: it is the reusable package, the one someone else might
# depend on, and the one where a wrong type is a correctness question rather
# than a formatting one.
#
# `qknot.audit` stays loose: untyped HTTP APIs. `qknot.cli` is checked with
# the project strict settings. Typer command signatures stay untyped where the
# framework's Option() defaults would fight the checker.
[[tool.mypy.overrides]]
module = ["qknot.audit.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
