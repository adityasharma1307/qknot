name: tests

# Full suite, including live network tests. OIDC registration uses a
# pre-minted identity token from the IDENTITY_TOKEN repository secret.
# If that secret is absent the OIDC test fails with "token not provisioned".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev,register,transparency,audit,pqc-fast]"

      - name: Ruff
        run: ruff check src/ tests/ scripts/

      - name: Tests
        env:
          QKNOT_IDENTITY_TOKEN: ${{ secrets.IDENTITY_TOKEN }}
        run: python -m pytest
