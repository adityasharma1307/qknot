name: tests

# Offline test suite only -- no secrets, no network. `allow_network`-marked
# tests (OIDC, live Sigstore/Fulcio/Rekor, live registry queries) are skipped
# by default (tests/conftest.py closes the network for everything else) and
# are validated separately via scripts/verify/*.py against real
# infrastructure, not in CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src/ tests/ scripts/

      - name: Tests
        run: python -m pytest
